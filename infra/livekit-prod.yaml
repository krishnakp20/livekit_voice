# LiveKit config for PRODUCTION (Linux, network_mode: host)
#
# Differences from livekit.yaml (dev):
#   - redis.address: 127.0.0.1:6379  (host loopback, since container is on host network)
#   - logging.level: warn             (less noise in production)

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  # With network_mode: host, LiveKit binds directly to this NIC — no Docker NAT
  node_ip: 192.168.11.226

keys:
  APIvoicebot: fH5peaazU12TecaePcKTdvVosN7LtoKouiuuFewSEfxM

# localhost works here because this container runs on the host network
# Redis is exposed on host:6379 via docker-compose ports mapping
redis:
  address: 127.0.0.1:6379

sip:
  enabled: true

turn:
  enabled: true
  domain: 192.168.11.226
  tls_port: 5349
  udp_port: 3478
  external_tls: false

logging:
  level: warn
