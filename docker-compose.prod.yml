# Production compose for Linux — MySQL and Redis run NATIVELY on the host.
# All containers use network_mode: host so they reach localhost MySQL/Redis/LiveKit directly.
#
# Before starting:
#   systemctl start mysql redis-server
#   mysql -u root -e "CREATE DATABASE IF NOT EXISTS vbots; CREATE USER IF NOT EXISTS 'vbots'@'localhost' IDENTIFIED BY 'vbots'; GRANT ALL PRIVILEGES ON vbots.* TO 'vbots'@'localhost'; FLUSH PRIVILEGES;"
#
# Start:
#   docker-compose -f docker-compose.prod.yml up -d

services:

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./infra/livekit-prod.yaml:/etc/livekit.yaml

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    network_mode: host
    volumes:
      - ./backend/data/recordings:/data/recordings
      - ./backend/data/uploads:/data/uploads
    command: >
      sh -c "python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    network_mode: host
    volumes:
      - ./backend/data/recordings:/data/recordings
    command: python worker/agent.py start

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    network_mode: host
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    network_mode: host
    command: celery -A app.tasks.celery_app beat --loglevel=info
