# LiveKit config for LOCAL DEV only (LiveKit running in Docker on the same Windows machine)
#
# Use this when: running `docker compose up livekit` locally on your dev machine
# Set in .env: LIVEKIT_URL=ws://127.0.0.1:7880
#
# HOW: Update docker-compose.yml livekit service to mount this file:
#   volumes:
#     - ./infra/livekit-dev.yaml:/etc/livekit.yaml

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  # 127.0.0.1 so worker on the same Windows machine can reach LiveKit via loopback
  # Docker Desktop CAN forward loopback ports reliably (unlike LAN IPs)
  node_ip: 127.0.0.1

keys:
  APIvoicebot: fH5peaazU12TecaePcKTdvVosN7LtoKouiuuFewSEfxM

redis:
  address: redis:6379

sip:
  enabled: true

turn:
  enabled: true
  domain: 127.0.0.1
  tls_port: 5349
  udp_port: 3478
  external_tls: false

logging:
  level: debug
